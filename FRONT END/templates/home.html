{% extends 'index.html' %}

{% block navbar %}
<!-- Add Font Awesome CDN if not already present in your base template -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<li>
  <a href="{{url_for('home')}}" class="active" style="color: #fff; text-decoration: none; padding: 12px 20px; background: linear-gradient(45deg, #007bff, #00b4d8); border-radius: 25px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,123,255,0.4);">
    <i class="fas fa-home" style="font-size: 18px;"></i>Home
  </a>
</li>
<li>
  <a href="{{url_for('upload')}}" style="color: #fff; text-decoration: none; padding: 12px 20px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
    <i class="fas fa-info-circle" style="font-size: 18px;"></i>Upload
  </a>
</li>
<li>
  <a href="{{url_for('model')}}" style="color: #fff; text-decoration: none; padding: 12px 20px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
    <i class="fas fa-info-circle" style="font-size: 18px;"></i>Model
  </a>
</li>
<li>
  <a href="{{url_for('prediction')}}" style="color: #fff; text-decoration: none; padding: 12px 20px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
    <i class="fas fa-magic" style="font-size: 18px;"></i>Prediction
  </a>
</li>
<li>
  <a href="{{url_for('index')}}" style="color: #fff; text-decoration: none; padding: 12px 20px; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;">
    <i class="fas fa-sign-out-alt" style="font-size: 18px;"></i>LogOut
  </a>
</li>     
{% endblock %}

{% block content %}
    <section id="hero" class="hero section" style="min-height: 100vh; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); position: relative; overflow: hidden;">
        <!-- Decorative Background Elements -->
        <div style="position: absolute; top: -50px; left: -50px; width: 200px; height: 200px; background: rgba(0,123,255,0.2); border-radius: 50%; filter: blur(50px);"></div>
        <div style="position: absolute; bottom: -50px; right: -50px; width: 300px; height: 300px; background: rgba(0,180,216,0.2); border-radius: 50%; filter: blur(50px);"></div>

        <div class="info d-flex align-items-center" style="position: relative; z-index: 2; height: 100%;">
            <div class="container">
                <div class="row justify-content-center" data-aos="fade-up" data-aos-delay="100">
                    <div class="col-12 text-center" style="background: rgba(255,255,255,0.1); padding: 40px; border-radius: 25px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 15px 40px rgba(0,0,0,0.15);">
                        <h2 style="color: #fff; font-size: 48px; font-weight: 800; text-shadow: 3px 3px 6px rgba(0,0,0,0.5); position: relative; display: inline-block; margin-bottom: 20px;">
                            <i class="fas fa-shield-virus" style="color: #00b4d8; margin-right: 15px;"></i>
                            WELCOME!
                            <span style="position: absolute; bottom: -10px; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, #007bff, #00b4d8); border-radius: 2px;"></span>
                        </h2>
                        <p style="color: #ddd; font-size: 22px; line-height: 1.6; font-weight: 400; max-width: 800px; margin: 0 auto; text-shadow: 1px 1px 3px rgba(0,0,0,0.3);">
                            Federated Learning for 6G Networks
                        </p>
                        <br>
                        <a href="{{url_for('prediction')}}" style="display: inline-flex; align-items: center; gap: 10px; background: linear-gradient(45deg, #007bff, #00b4d8); color: #fff; padding: 15px 30px; border-radius: 12px; text-decoration: none; font-size: 18px; font-weight: 600; transition: all 0.3s ease; box-shadow: 0 6px 20px rgba(0,123,255,0.4);" onmouseover="this.style.transform='translateY(-3px)'" onmouseout="this.style.transform='translateY(0)'">
                            <i class="fas fa-arrow-right"></i>
                            Get Started
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <div id="hero-carousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;">
            <div class="carousel-item active">
                <img src="/static/img/background1.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: blur(2px);">
            </div>
            <div class="carousel-item">
                <img src="/static/img/background2.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.4; filter: blur(2px);">
            </div>
            <!-- Carousel Indicators -->
            <div class="carousel-indicators" style="bottom: 20px;">
                <button type="button" data-bs-target="#hero-carousel" data-bs-slide-to="0" class="active" style="width: 12px; height: 12px; border-radius: 50%; background: #00b4d8; border: none; margin: 0 5px;"></button>
                <button type="button" data-bs-target="#hero-carousel" data-bs-slide-to="1" style="width: 12px; height: 12px; border-radius: 50%; background: #007bff; border: none; margin: 0 5px;"></button>
            </div>
        </div>
    </section>
{% endblock %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federated Learning for 6G Networks: Navigating Privacy Benefits and Challenges</title>

    <!-- Favicons -->
    <link href="/static/img/favicon.png" rel="icon" />
    <link href="/static/img/apple-touch-icon.png" rel="apple-touch-icon" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />

    <!-- Vendor CSS -->
    <link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="/static/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" />

    <!-- Main CSS -->
    <link href="/static/css/main.css" rel="stylesheet" />

    <!-- Inline Styles -->
    <style>
        body {
            background: url('/static/img/6g_bg.jpg') center/cover fixed, #16213e;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* ---------- HEADER ---------- */
        #header {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            padding: 15px 0;
            transition: all 0.3s ease;
        }

        .logo img {
            max-height: 40px;
            margin-right: 10px;
            transition: transform .3s;
        }

        .logo img:hover {
            transform: rotate(360deg);
        }

        .sitename {
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sitename span {
            color: #00b4d8;
            font-size: 30px;
        }

        /* ---------- MAIN CENTER CARD ---------- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border-radius: 24px;
            max-width: 480px;
            width: 100%;
            padding: 2rem 2.5rem;
        }

        .btn-primary-gradient {
            background: linear-gradient(45deg, #007bff, #00b4d8);
            border: none;
            color: #fff;
            border-radius: 25px;
            padding: .6rem 2.5rem;
            transition: transform .25s;
        }

        .btn-primary-gradient:hover {
            transform: translateY(-3px);
        }

        select {
            background: rgba(255, 255, 255, 0.9);
        }

        /* ---------- SCROLL TOP ---------- */
        .scroll-top {
            background: linear-gradient(45deg, #007bff, #00b4d8);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            bottom: 24px;
            right: 24px;
            cursor: pointer;
            z-index: 10;
            display: none;
        }

        .scroll-top:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="index-page">
    <!-- Decorative blobs -->
    <div
        style="position:absolute;top:-50px;left:-50px;width:200px;height:200px;background:rgba(0,123,255,.2);border-radius:50%;filter:blur(50px);z-index:0;">
    </div>
    <div
        style="position:absolute;bottom:-50px;right:-50px;width:300px;height:300px;background:rgba(0,180,216,.2);border-radius:50%;filter:blur(50px);z-index:0;">
    </div>

    <!-- =============== HEADER =============== -->
    <header id="header" class="header d-flex align-items-center fixed-top">
        <div class="container-fluid container-xl d-flex align-items-center justify-content-between">
            <a href="#" class="logo d-flex align-items-center">
                <img src="/static/img/icon.png" alt="icon" />
                <h1 class="sitename mb-0">Federated Learning in 6G: Managing Privacy and Issues</h1><span>.</span>
            </a>

            <nav id="navmenu" class="navmenu">
                <ul class="m-0" style="display:flex;align-items:center;gap:10px;list-style:none;">
                    <link rel="stylesheet"
                        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
                    <li><a href="{{ url_for('home') }}" class="text-white d-flex align-items-center gap-2 px-3 py-2"><i
                                class="fas fa-home"></i>Home</a></li>
                    <li><a href="{{ url_for('upload') }}"
                            class="text-white d-flex align-items-center gap-2 px-3 py-2"><i
                                class="fas fa-upload"></i>Upload</a></li>
                    <li><a href="{{ url_for('model') }}" class="text-white d-flex align-items-center gap-2 px-3 py-2"><i
                                class="fas fa-cogs"></i>Model</a></li>
                    <li><a href="{{ url_for('prediction') }}"
                            class="active text-white d-flex align-items-center gap-2 px-3 py-2"
                            style="background:linear-gradient(45deg,#007bff,#00b4d8);border-radius:25px;box-shadow:0 4px 15px rgba(0,123,255,.4);"><i
                                class="fas fa-magic"></i>Prediction</a></li>
                    <li><a href="{{ url_for('index') }}" class="text-white d-flex align-items-center gap-2 px-3 py-2"><i
                                class="fas fa-sign-out-alt"></i>Logout</a></li>
                </ul>
                <i class="mobile-nav-toggle d-xl-none bi bi-list"
                    style="color:#00b4d8;font-size:28px;cursor:pointer;"></i>
            </nav>
        </div>
    </header>

    <!-- =============== CENTER CARD =============== -->
    <main>
        <div class="glass-card text-center text-gray-900">
            <h2 class="fw-semibold mb-4 text-white">Select Algorithm for Model Evaluation</h2>
            <form action="{{ url_for('model') }}" method="post" class="d-grid gap-3">
                <select id="algo" name="algo" class="form-select form-select-lg">
                    <option value="RandomForest">Random Forest</option>
                    <option value="FNN">Feed‑Forward NN (FNN)</option>
                    <option value="CNN">Convolutional NN (CNN)</option>
                    <option value="MLP">MLP</option>
                    <option value="XGB">XGBoost (XGB)</option>
                    <option value="DT">Decision Tree (DT)</option>
                </select>

                <button type="submit" class="btn btn-primary-gradient mt-2">Submit</button>
                {% if msg %}
                <div class="mt-3">
                    <p class="fw-semibold text-white mb-0">{{ msg }}</p>
                    {% if msg1 %}<p class="fs-4 fw-bold text-success">{{ msg1 }}</p>{% endif %}
                </div>
                {% endif %}
            </form>
        </div>
    </main>

    <!-- ===================== Scroll‑to‑Top ===================== -->
    <div class="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'});">
        <i class="bi bi-arrow-up-circle text-white fs-4"></i>
    </div>

    <!-- Vendor JS -->
    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
        const sTop = document.querySelector('.scroll-top');
        window.addEventListener('scroll', () => {
            sTop.style.display = (window.scrollY > 300 ? 'flex' : 'none');
        });
    </script>
</body>

</html>
